name: Run Maven flaky-test detector
description: >
  Pre-compiles the module, then runs one detector plugin and tees its output to
  logs/TOOL_log.txt inside the module. Failures never fail the step, matching
  the original workflows.

inputs:
  tool:
    description: Short tool name (idflakies, nondex or flakesync), used for the log file name
    required: true
  module-path:
    description: Module path inside the repository, or . for the root
    required: true
  mvn-args:
    description: Plugin goal and tool-specific flags, space separated and without spaces inside a flag
    required: true
  job-timeout-minutes:
    description: >
      Optional. When set, the detector is wrapped in timeout with a limit of this
      value minus 5 minutes (minimum 5), leaving time for archiving.
    required: false
    default: ""
  test-names:
    description: >
      Optional comma-separated Class#method list. When set, the detector runs once
      per test with -Dflakesync.testName=<test> appended, all sharing the time limit.
    required: false
    default: ""

  followup-goals:
    description: >
      Optional space-separated Maven goals run, for each test in test-names, right after
      mvn-args (same -Dflakesync.testName, same shared time limit). Used for FlakeSync so
      concurrentfind is followed by delaylocs. Skipped for a test whose ResultMethods file
      is empty (no concurrent methods to delay).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run ${{ inputs.tool }}
      shell: bash
      working-directory: ${{ inputs.module-path }}
      env:
        TOOL: ${{ inputs.tool }}
        MVN_ARGS: ${{ inputs.mvn-args }}
        JOB_TIMEOUT: ${{ inputs.job-timeout-minutes }}
        TEST_NAMES: ${{ inputs.test-names }}
        FOLLOWUP_GOALS: ${{ inputs.followup-goals }}
      run: |
        mkdir -p logs
        unset MAVEN_OPTS

        SKIPS=(-Dcheckstyle.skip=true -Drat.skip=true -Dmaven.javadoc.skip=true)
        # ADD -U HERE so every mvn call inside the detector forces snapshot updates
        COMMON=(-B -Dmaven.test.failure.ignore=true -DfailIfNoTests=false -U "${SKIPS[@]}")

        mvn test-compile -q -B -DskipTests -U "${SKIPS[@]}" || true

        TIMEOUT_CMD=()
        if [ -n "$JOB_TIMEOUT" ]; then
          LIMIT=$(( JOB_TIMEOUT > 5 ? JOB_TIMEOUT - 5 : 5 ))
          TIMEOUT_CMD=(timeout --foreground "${LIMIT}m")
        fi

        if [ -n "$TEST_NAMES" ]; then
          # One mvn run per test, all sharing the overall time budget
          : > "logs/${TOOL}_log.txt"
          IFS=',' read -ra TESTS <<< "$TEST_NAMES"
          DEADLINE=$(( SECONDS + ${LIMIT:-0} * 60 ))
          run_goal() {   # run_goal <goals> <test> <label>; returns 1 when the time budget is gone
            local goals="$1" t="$2" label="$3" tc=()
            if [ -n "$JOB_TIMEOUT" ]; then
              local remaining=$(( DEADLINE - SECONDS ))
              if [ "$remaining" -le 0 ]; then
                echo "Time budget used up; skipping remaining tests" | tee -a "logs/${TOOL}_log.txt"
                return 1
              fi
              tc=(timeout --foreground "${remaining}s")
            fi
            echo "=== ${TOOL}: $t ($label) ===" | tee -a "logs/${TOOL}_log.txt"
            # goals is intentionally unquoted so it splits into separate arguments
            # shellcheck disable=SC2086
            "${tc[@]}" mvn $goals -Dflakesync.testName="$t" "${COMMON[@]}" 2>&1 | tee -a "logs/${TOOL}_log.txt" || true
            return 0
          }
          for T in "${TESTS[@]}"; do
            [ -z "$T" ] && continue
            run_goal "$MVN_ARGS" "$T" "main" || break
            for G in $FOLLOWUP_GOALS; do
              RM=$(find . -path '*/.flakesync/*' \( -name "${T}-ResultMethods.txt" -o -name "${T}.ResultMethods.txt" -o -name "${T}ResultMethods.txt" \) 2>/dev/null | head -n1)
              if [ -n "$RM" ] && [ ! -s "$RM" ]; then
                echo "=== ${TOOL}: $T: no concurrent methods found, skipping ${G##*:} ===" | tee -a "logs/${TOOL}_log.txt"
                continue
              fi
              run_goal "$G" "$T" "${G##*:}" || break 2
            done
          done
        else
          # MVN_ARGS is intentionally unquoted so it splits into separate arguments
          # shellcheck disable=SC2086
          "${TIMEOUT_CMD[@]}" mvn $MVN_ARGS "${COMMON[@]}" 2>&1 | tee "logs/${TOOL}_log.txt" || true
        fi
