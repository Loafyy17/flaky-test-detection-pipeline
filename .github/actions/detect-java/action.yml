name: Detect and set up project JDK
description: >
  Detects the Java version the module needs (8, 11 or 17) and installs it with
  setup-java. Run from the workspace root of the checked-out target repo.

inputs:
  module-path:
    description: Module path inside the repository, or . for the root
    required: true
  force-java-version:
    description: Optional override (8, 11 or 17)
    required: false
    default: ""

outputs:
  java-version:
    description: The JDK version that was installed
    value: ${{ steps.detect.outputs.java_version }}

runs:
  using: composite
  steps:
    - name: Detect required Java version
      id: detect
      shell: bash
      env:
        FORCE_JAVA_VERSION: ${{ inputs.force-java-version }}
      run: python3 "${{ github.action_path }}/../scripts/detect_java_version.py" "${{ inputs.module-path }}"

    - name: Set up project JDK
      uses: actions/setup-java@v5
      with:
        distribution: corretto
        java-version: ${{ steps.detect.outputs.java_version }}
