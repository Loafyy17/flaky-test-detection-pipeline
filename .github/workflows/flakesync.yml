name: Run FlakeSync
on:
  workflow_call:
    inputs:
      repo_slug:
        required: true
        type: string
      sha:
        required: true
        type: string
      module_path:
        required: true
        type: string
      repo_name:
        required: true
        type: string
      repo_url:
        required: true
        type: string
      test_names:
        required: false
        type: string
      force_java_version:
        required: false
        type: string
      max_job_timeout:
        required: true
        type: string

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(inputs.max_job_timeout) }}

    # 1. Added job-level permissions
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo_slug }}
          ref: ${{ inputs.sha }}

      # The target repo owns the workspace root, so shared actions/scripts live in a hidden sub-folder.
      - name: Checkout Pipeline Actions and Scripts
        uses: actions/checkout@v4
        with:
          path: .pipeline-tools
          sparse-checkout: |
            .github/actions
            .github/scripts
          sparse-checkout-cone-mode: false

      # Detection tools are BUILT with JDK 11; the project's JDK is switched afterward.
      - name: Set up JDK 11 (build detection tools)
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '11'

      # 2. Configure Maven Settings with GITHUB_TOKEN and Global Snapshots
      - name: Configure Maven Settings with GITHUB_TOKEN and Snapshots
        run: |
          mkdir -p ~/.m2
          cat << EOF > ~/.m2/settings.xml
          <settings>
            <profiles>
              <profile>
                <id>global-snapshots</id>
                <repositories>
                  <repository>
                    <id>apache.snapshots</id>
                    <url>https://repository.apache.org/snapshots</url>
                    <releases><enabled>false</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                  <repository>
                    <id>sonatype-snapshots</id>
                    <url>https://oss.sonatype.org/content/repositories/snapshots</url>
                    <releases><enabled>false</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                  <repository>
                    <id>spring-snapshots</id>
                    <url>https://repo.spring.io/snapshot</url>
                    <releases><enabled>false</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>global-snapshots</activeProfile>
            </activeProfiles>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout FlakeSync Repository
        uses: actions/checkout@v4
        with:
          repository: UT-SE-Research/FlakeSync
          path: flakesync-repo

      - name: Build FlakeSync Plugin Locally
        run: |
          cd flakesync-repo
          mvn clean install -U -DskipTests -B
          echo "--- installed artifacts ---"
          find ~/.m2/repository -ipath "*flakesync*" \( -name "*.pom" -o -name "*.jar" \)

      # 3. Added full root project dependency installation to populate local snapshot BOMs/parents
      - name: Install Root Project Dependencies
        run: mvn clean install -DskipTests -Dmaven.javadoc.skip=true -B -V -fn -U

      # Switch to the JDK the project under test needs (8 / 11 / 17). Must come after the plugin build.
      - name: Set up Project JDK
        id: jdk
        uses: ./.pipeline-tools/.github/actions/detect-java
        with:
          module-path: ${{ inputs.module_path }}
          force-java-version: ${{ inputs.force_java_version }}
          
      - name: Save Run Metadata
        uses: ./.pipeline-tools/.github/actions/save-metadata
        with:
          repo-url: ${{ inputs.repo_url }}
          sha: ${{ inputs.sha }}
          module-path: ${{ inputs.module_path }}

      - name: Run FlakeSync
        if: inputs.test_names != ''
        continue-on-error: true
        uses: ./.pipeline-tools/.github/actions/run-detector
        with:
          tool: flakesync
          module-path: ${{ inputs.module_path }}
          mvn-args: edu.utexas.ece:flakesync-maven-plugin:1.0-SNAPSHOT:concurrentfind
          test-names: ${{ inputs.test_names }}
          followup-goals: edu.utexas.ece:flakesync-maven-plugin:1.0-SNAPSHOT:delaylocs
          job-timeout-minutes: ${{ inputs.max_job_timeout }}

      - name: Build CSV rows
        if: always()
        continue-on-error: true
        env:
          REPO_URL: ${{ inputs.repo_url }}
          SHA: ${{ inputs.sha }}
          MODULE_PATH: ${{ inputs.module_path }}
        run: python3 .pipeline-tools/.github/scripts/build_rows.py flakesync "$REPO_URL" "$SHA" "$MODULE_PATH"

      - name: Archive FlakeSync Results and Logs
        if: always()
        uses: ./.pipeline-tools/.github/actions/archive-results
        with:
          tool: flakesync
          repo-name: ${{ inputs.repo_name }}
          sha: ${{ inputs.sha }}
          results-glob: '**/.flakesync/**'
