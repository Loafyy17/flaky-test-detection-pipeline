name: Run FlakeSync
on:
  workflow_call:
    inputs:
      repo_slug:
        required: true
        type: string
      sha:
        required: true
        type: string
      module_path:
        required: true
        type: string
      repo_name:
        required: true
        type: string
      repo_url:
        required: true
        type: string
      test_names:
        required: false
        type: string
      force_java_version:
        required: false
        type: string
      max_job_timeout:
        required: true
        type: string

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(inputs.max_job_timeout) }}
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo_slug }}
          ref: ${{ inputs.sha }}

      # The target repo owns the workspace root, so shared actions/scripts live in a hidden sub-folder.
      - name: Checkout Pipeline Actions and Scripts
        uses: actions/checkout@v4
        with:
          path: .pipeline-tools
          sparse-checkout: |
            .github/actions
            .github/scripts
          sparse-checkout-cone-mode: false

      # Detection tools are always BUILT with JDK 8; the project's JDK is switched afterward.
      - name: Set up JDK 8 (build detection tools)
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '8'

      # Must run BEFORE the plugin builds, or it would wipe what they install.
      - name: Configure Clean Global Maven Repositories
        run: |
          rm -rf ~/.m2
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <profiles>
              <profile>
                <id>fallback-snapshots-profile</id>
                <activation>
                  <activeByDefault>true</activeByDefault>
                </activation>
                <repositories>
                  <repository>
                    <id>apache-snapshots-repo</id>
                    <url>https://repository.apache.org/snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </repository>
                  <repository>
                    <id>ossrh-snapshots-repo</id>
                    <url>https://oss.sonatype.org/content/repositories/snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>apache-plugin-snapshots-repo</id>
                    <url>https://repository.apache.org/snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
          </settings>
          EOF

      - name: Checkout iDFlakies Repository
        uses: actions/checkout@v4
        with:
          repository: UT-SE-Research/iDFlakies
          path: idflakies-repo

      - name: Build and Install iDFlakies Plugin Locally
        run: |
          cd idflakies-repo
          mvn clean install -DskipTests -B

      - name: Checkout FlakeSync Repository
        uses: actions/checkout@v4
        with:
          repository: UT-SE-Research/FlakeSync
          path: flakesync-repo

      - name: Build FlakeSync Plugin Locally
        run: |
          cd flakesync-repo
          mvn clean install -U -DskipTests -B
          echo "--- installed artifacts ---"
          find ~/.m2/repository -ipath "*flakesync*" \( -name "*.pom" -o -name "*.jar" \)

      # Switch to the JDK the project under test needs (8 / 11 / 17). Must come after both plugin builds.
      - name: Set up Project JDK
        uses: ./.pipeline-tools/.github/actions/detect-java
        with:
          module-path: ${{ inputs.module_path }}
          force-java-version: ${{ inputs.force_java_version }}

      - name: Force Global Dependency & Multi-Module Local Resolution
        continue-on-error: true
        run: |
          mvn clean install -B -U -DskipTests -Dcheckstyle.skip=true -Drat.skip=true -Dmaven.javadoc.skip=true || true
          if [ "${{ inputs.module_path }}" != "." ]; then
            cd ${{ inputs.module_path }}
            mvn test-compile -B -Dcheckstyle.skip=true -Drat.skip=true -Dmaven.javadoc.skip=true || true
          fi

      - name: Save Run Metadata
        uses: ./.pipeline-tools/.github/actions/save-metadata
        with:
          repo-url: ${{ inputs.repo_url }}
          sha: ${{ inputs.sha }}
          module-path: ${{ inputs.module_path }}

      - name: Run FlakeSync
        if: inputs.test_names != ''
        continue-on-error: true
        uses: ./.pipeline-tools/.github/actions/run-detector
        with:
          tool: flakesync
          module-path: ${{ inputs.module_path }}
          mvn-args: edu.utexas.ece:flakesync-maven-plugin:1.0-SNAPSHOT:concurrentfind
          test-names: ${{ inputs.test_names }}
          job-timeout-minutes: ${{ inputs.max_job_timeout }}

      - name: Build CSV rows
        if: always()
        continue-on-error: true
        env:
          REPO_URL: ${{ inputs.repo_url }}
          SHA: ${{ inputs.sha }}
          MODULE_PATH: ${{ inputs.module_path }}
        run: python3 .pipeline-tools/.github/scripts/build_rows.py idflakies "$REPO_URL" "$SHA" "$MODULE_PATH"

      - name: Archive FlakeSync Results and Logs
        if: always()
        uses: ./.pipeline-tools/.github/actions/archive-results
        with:
          tool: flakesync
          repo-name: ${{ inputs.repo_name }}
          sha: ${{ inputs.sha }}
          results-glob: '**/.flakesync/**'
