name: Dynamic Flaky Test Detection Pipeline

on:
  workflow_dispatch:
    inputs:
      max_projects:
        description: 'Maximum number of projects to run (leave empty for all)'
        required: false
        default: '5'
      offset:
        description: 'Starting row index in pr-data.csv (0-based)'
        required: false
        default: '0'
      max_job_timeout:
        description: 'Maximum time limit per detection job in minutes (e.g., 15, 30)'
        required: false
        default: '20'

jobs:
  prepare:
    name: Generate Dynamic Matrix from IDoFT
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install pandas

      - name: Generate Matrix JSON
        id: set-matrix
        env:
          MAX_RUNS: ${{ github.event.inputs.max_projects }}
          OFFSET: ${{ github.event.inputs.offset }}
        run: python .github/scripts/generate_matrix.py >> $GITHUB_OUTPUT

  detect:
    name: ${{ matrix.repo_name }} (${{ matrix.sha }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.max_job_timeout != '' && fromJson(inputs.max_job_timeout) || 20 }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo_slug }}
          ref: ${{ matrix.sha }}

      - name: Set up Java 8 and 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: |
            8
            17

      - name: Save Run Metadata & Pre-create Output Directories
        run: |
          mkdir -p .output_metadata .dtfixingtools .nondex
          mkdir -p ${{ matrix.module_path }}/.output_metadata ${{ matrix.module_path }}/.dtfixingtools ${{ matrix.module_path }}/.nondex

          touch .dtfixingtools/.keep .nondex/.keep
          touch ${{ matrix.module_path }}/.dtfixingtools/.keep ${{ matrix.module_path }}/.nondex/.keep

          cat <<EOF > .output_metadata/run_metadata.json
          {
            "github_url": "${{ matrix.repo_url }}",
            "sha": "${{ matrix.sha }}",
            "module_path": "${{ matrix.module_path }}"
          }
          EOF

          if [ "${{ matrix.module_path }}" != "." ]; then
            cp .output_metadata/run_metadata.json ${{ matrix.module_path }}/.output_metadata/run_metadata.json
          fi

      - name: Run iDFlakies Detection (Auto Fallback JDK 8 -> 17)
        continue-on-error: true
        run: |
          cd ${{ matrix.module_path }}
          
          # 1. Determine target JDK version before calling Maven to prevent JVM corruption
          USE_JDK17=false
          if find target/test-classes target/classes -name "*.class" 2>/dev/null | xargs javap -verbose 2>/dev/null | grep -q "major version: 61"; then
            echo "Forcing JDK 17 context..."
            USE_JDK17=true
          fi

          if [ "$USE_JDK17" = "true" ]; then
            export JAVA_HOME=$JAVA_HOME_17_X64
            # Use MAVEN_OPTS to cleanly inject runtime flags without wiping out the project pom's argLine definitions
            export MAVEN_OPTS="--add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED"
          else
            export JAVA_HOME=$JAVA_HOME_8_X64
            unset MAVEN_OPTS
          fi

          # 2. Re-compile using the verified Java environment path
          $JAVA_HOME/bin/java -version
          mvn test-compile -q -B -DskipTests -Dcheckstyle.skip=true -Drat.skip=true -Dmaven.javadoc.skip=true || true
          
          JOB_TIMEOUT=${{ inputs.max_job_timeout != '' && inputs.max_job_timeout || 20 }}
          IDFLAKIES_TIMEOUT=$(( JOB_TIMEOUT > 5 ? JOB_TIMEOUT - 5 : 5 ))m

          echo "Running iDFlakies on target codebase..."

          # 3. Execute iDFlakies. Note: Do NOT use -DargLine over the terminal.
          timeout --foreground $IDFLAKIES_TIMEOUT mvn edu.illinois.cs:idflakies-maven-plugin:2.0.0:detect \
            -B \
            -Dstyle.color=always \
            -Ddetector.detector_type=random-class-method \
            -Ddt.randomize.rounds=10 \
            -Ddt.detector.original_order.all_must_pass=false \
            -Ddt.detector.original_order.retry_count=3 \
            -Dmaven.test.failure.ignore=false \
            -DfailIfNoTests=false \
            -Dcheckstyle.skip=true \
            -Drat.skip=true \
            -Dmaven.javadoc.skip=true


      - name: Run NonDex Detection (Auto Fallback JDK 8 -> 17)
        continue-on-error: true
        run: |
          cd ${{ matrix.module_path }}
          
          # Check if target class files require Java 17
          USE_JDK17=false
          if find target/test-classes target/classes -name "*.class" 2>/dev/null | xargs javap -verbose 2>/dev/null | grep -q "major version: 61"; then
            echo "Detected Java 17 class bytecode (version 61.0). Forcing JDK 17 for NonDex..."
            USE_JDK17=true
          fi

          # Safe runtime configurations to open internals to NonDex shuffler on modern JDK versions
          export MAVEN_OPTS="--add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED --add-opens java.base/java.util.concurrent=ALL-UNNAMED"

          if [ "$USE_JDK17" = "true" ]; then
            JAVA_HOME=$JAVA_HOME_17_X64 mvn edu.illinois:nondex-maven-plugin:2.2.1:nondex \
              -B \
              -DnondexRuns=10 \
              -DnondexMode=FULL \
              -Dmaven.test.failure.ignore=true \
              -DfailIfNoTests=false \
              -Dorg.slf4j.simpleLogger.defaultLogLevel=warn \
              -Dcheckstyle.skip=true \
              -Drat.skip=true \
              -Dmaven.javadoc.skip=true || true
          else
            JAVA_HOME=$JAVA_HOME_8_X64 mvn edu.illinois:nondex-maven-plugin:2.2.1:nondex \
              -B \
              -DnondexRuns=10 \
              -DnondexMode=FULL \
              -Dmaven.test.failure.ignore=true \
              -DfailIfNoTests=false \
              -Dorg.slf4j.simpleLogger.defaultLogLevel=warn \
              -Dcheckstyle.skip=true \
              -Drat.skip=true \
              -Dmaven.javadoc.skip=true || \
            JAVA_HOME=$JAVA_HOME_17_X64 mvn edu.illinois:nondex-maven-plugin:2.2.1:nondex \
              -B \
              -DnondexRuns=10 \
              -DnondexMode=FULL \
              -Dmaven.test.failure.ignore=true \
              -DfailIfNoTests=false \
              -Dorg.slf4j.simpleLogger.defaultLogLevel=warn \
              -Dcheckstyle.skip=true \
              -Drat.skip=true \
              -Dmaven.javadoc.skip=true || true
          fi

          
      - name: Archive Job Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.repo_name }}-${{ matrix.sha }}
          path: |
            **/run_metadata.json
            **/.dtfixingtools/**
            **/.nondex/**
            **/failing-test-output*/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  aggregate:
    name: Aggregate Summary CSVs
    needs: detect
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download All Runner Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          include-hidden-files: true

      - name: Run Aggregator Script
        run: python .github/scripts/aggregate_results.py

      - name: Upload iDFlakies Summary CSV
        uses: actions/upload-artifact@v4
        with:
          name: idflakies_summary_csv
          path: idflakies_summary.csv

      - name: Upload NonDex Summary CSV
        uses: actions/upload-artifact@v4
        with:
          name: nondex_summary_csv
          path: nondex_summary.csv
