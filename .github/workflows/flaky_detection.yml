name: Dynamic Flaky Test Detection Pipeline

on:
  workflow_dispatch:
    inputs:
      max_projects:
        description: 'Maximum number of projects to run (leave empty for all)'
        required: false
        default: '5'
      offset:
        description: 'Starting row index in pr-data.csv (0-based)'
        required: false
        default: '0'
      max_job_timeout:
        description: 'Maximum time limit per detection job in minutes (e.g., 15, 30)'
        required: false
        default: '20'

jobs:
  prepare:
    name: Generate Dynamic Matrix from IDoFT
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install pandas

      - name: Generate Matrix JSON
        id: set-matrix
        env:
          MAX_RUNS: ${{ github.event.inputs.max_projects }}
          OFFSET: ${{ github.event.inputs.offset }}
        run: python .github/scripts/generate_matrix.py >> $GITHUB_OUTPUT

  detect:
    name: ${{ matrix.repo_name }} (${{ matrix.sha }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.inputs.max_job_timeout != '' && fromJson(github.event.inputs.max_job_timeout) || 20 }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo_slug }}
          ref: ${{ matrix.sha }}

      - name: Set up Java Environment
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version-file: '${{ github.workspace }}/${{ matrix.module_path }}/pom.xml'
          java-version: '8' 

      # ==========================================================
      # STRATEGY 1: CONFIGURE CLEAN OFFICIAL REPOSITORY FALLBACKS
      # ==========================================================
      - name: Configure Clean Global Maven Repositories
        run: |
          rm -rf ~/.m2
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <profiles>
              <profile>
                <id>fallback-snapshots-profile</id>
                <activation>
                  <activeByDefault>true</activeByDefault>
                </activation>
                <repositories>
                  <repository>
                    <id>apache-snapshots-repo</id>
                    <url>https://repository.apache.org/snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </repository>
                  <repository>
                    <id>ossrh-snapshots-repo</id>
                    <url>https://oss.sonatype.org/content/repositories/snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>apache-plugin-snapshots-repo</id>
                    <url>https://repository.apache.org/snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
          </settings>
          EOF

      # ==========================================================
      # BUILD AND INSTALL IDFLAKIES MAVEN PLUGIN LOCALLY
      # ==========================================================
      - name: Checkout iDFlakies Repository
        if: startsWith(steps.setup-java.outputs.version, '8') || startsWith(steps.setup-java.outputs.version, '1.8')
        uses: actions/checkout@v4
        with:
          repository: UT-SE-Research/iDFlakies
          path: idflakies-repo

      - name: Build and Install iDFlakies Plugin Locally
        if: startsWith(steps.setup-java.outputs.version, '8') || startsWith(steps.setup-java.outputs.version, '1.8')
        run: |
          cd idflakies-repo
          mvn clean install -DskipTests -B

      # ==========================================================
      # FORCE ROOT INSTALL PASS FOR MULTI-MODULE BOMs
      # ==========================================================
      - name: Force Global Dependency & Multi-Module Local Resolution
        continue-on-error: true
        run: |
          echo "=== INSTALLING ROOT & PARENT POMS TO LOCAL M2 ==="
          mvn clean install -B -U -DskipTests -Dcheckstyle.skip=true -Drat.skip=true -Dmaven.javadoc.skip=true || true
          
          if [ "${{ matrix.module_path }}" != "." ]; then
            echo "=== PRE-BUILDING TARGET SUBMODULE: ${{ matrix.module_path }} ==="
            cd ${{ matrix.module_path }}
            mvn test-compile -B -Dcheckstyle.skip=true -Drat.skip=true -Dmaven.javadoc.skip=true || true
          fi

      - name: Save Run Metadata & Pre-create Output Directories
        run: |
          mkdir -p .output_metadata .dtfixingtools .nondex
          mkdir -p ${{ matrix.module_path }}/.output_metadata ${{ matrix.module_path }}/.dtfixingtools ${{ matrix.module_path }}/.nondex

          touch .dtfixingtools/.keep .nondex/.keep
          touch ${{ matrix.module_path }}/.dtfixingtools/.keep ${{ matrix.module_path }}/.nondex/.keep

          cat <<EOF > .output_metadata/run_metadata.json
          {
            "github_url": "${{ matrix.repo_url }}",
            "sha": "${{ matrix.sha }}",
            "module_path": "${{ matrix.module_path }}"
          }
          EOF

          if [ "${{ matrix.module_path }}" != "." ]; then
            cp .output_metadata/run_metadata.json ${{ matrix.module_path }}/.output_metadata/run_metadata.json
          fi

      # ==========================================
      # STEP 1: RUN NONDEX (Fastest, API-focused)
      # ==========================================
      - name: Run NonDex Detection
        continue-on-error: true
        run: |
          cd ${{ matrix.module_path }}
          
          echo "=== VERIFYING NONDEX JVM RUNTIME ==="
          java -version
          echo "===================================="

          echo "Running NonDex under detected Java ${{ steps.setup-java.outputs.version }} environment..."

          mvn edu.illinois:nondex-maven-plugin:2.2.1:nondex \
            -B -U \
            -DnondexRuns=3 \
            -DnondexMode=FULL \
            -DreuseForks=true \
            -DforkCount=1 \
            -DargLine="" \
            -Dmaven.test.failure.ignore=true \
            -DfailIfNoTests=false \
            -Dorg.slf4j.simpleLogger.defaultLogLevel=warn \
            -Dcheckstyle.skip=true \
            -Drat.skip=true \
            -Dmaven.javadoc.skip=true

      # ==========================================
      # STEP 2: RUN FLAKESYNC (Targeted & Linear)
      # ==========================================
      - name: Checkout FlakeSync Repository
        uses: actions/checkout@v4
        with:
          repository: UT-SE-Research/FlakeSync
          path: flakesync-repo

      - name: Build FlakeSync Plugin Locally
        run: |
          cd flakesync-repo
          mvn clean install -U -DskipTests -B

      - name: Run FlakeSync (Concurrent Find & Delay Injection)
        continue-on-error: true
        run: |
          cd ${{ matrix.module_path }}
          
          TEST_NAMES="${{ matrix.test_names }}"
          
          if [ -n "$TEST_NAMES" ]; then
            IFS=',' read -ra ADDR <<< "$TEST_NAMES"
            for TEST_NAME in "${ADDR[@]}"; do
              echo "=== Running FlakeSync on $TEST_NAME ==="
              
              echo "-> Finding concurrent methods"
              mvn edu.utexas.ece:flakesync-maven-plugin:1.0-SNAPSHOT:concurrentfind \
                -Dflakesync.testName="$TEST_NAME" -B -U -Dcheckstyle.skip=true -Drat.skip=true
              
              echo "-> Injecting delays to locate failures"
              mvn edu.utexas.ece:flakesync-maven-plugin:1.0-SNAPSHOT:delaylocs \
                -Dflakesync.testName="$TEST_NAME" -B -U -Dcheckstyle.skip=true -Drat.skip=true
            done
          else
            echo "Warning: No test names provided in matrix to run FlakeSync."
          fi

      # ==========================================
      # STEP 3: RUN IDFLAKIES (Moved to Back / Slowest)
      # ==========================================
      - name: Run iDFlakies Detection
        if: startsWith(steps.setup-java.outputs.version, '8') || startsWith(steps.setup-java.outputs.version, '1.8')
        continue-on-error: true
        run: |
          cd ${{ matrix.module_path }}
          unset MAVEN_OPTS
          
          echo "=== VERIFYING IDFLAKIES JVM RUNTIME ==="
          java -version
          mvn -version
          echo "======================================="

          JOB_TIMEOUT=${{ github.event.inputs.max_job_timeout != '' && github.event.inputs.max_job_timeout || 20 }}
          IDFLAKIES_TIMEOUT=$(( JOB_TIMEOUT > 5 ? JOB_TIMEOUT - 5 : 5 ))m

          echo "Running iDFlakies under detected Java ${{ steps.setup-java.outputs.version }} environment..."

          timeout --foreground $IDFLAKIES_TIMEOUT mvn edu.illinois.cs:idflakies-maven-plugin:2.0.0:detect \
            -B -U \
            -Dstyle.color=always \
            -Ddetector.detector_type=random-class-method \
            -Ddt.randomize.rounds=10 \
            -Ddt.detector.original_order.all_must_pass=false \
            -Ddt.detector.original_order.retry_count=3 \
            -Dmaven.test.failure.ignore=true \
            -DfailIfNoTests=false \
            -Dcheckstyle.skip=true \
            -Drat.skip=true \
            -Dmaven.javadoc.skip=true

      # ==========================================
      # STEP 4: COMBINED UNIFIED ARCHIVAL
      # ==========================================
      - name: Archive All Tool Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.repo_name }}-${{ matrix.sha }}
          path: |
            **/run_metadata.json
            **/.dtfixingtools/**
            **/.nondex/**
            **/.flakesync/**
            **/failing-test-output*/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  aggregate:
    name: Aggregate Summary CSVs
    needs: detect
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download All Runner Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          include-hidden-files: true

      - name: Run Aggregator Script
        run: python .github/scripts/aggregate_results.py

      - name: Upload iDFlakies Summary CSV
        uses: actions/upload-artifact@v
