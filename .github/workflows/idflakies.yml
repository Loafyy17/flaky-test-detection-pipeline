name: Run iDFlakies
on:
  workflow_call:
    inputs:
      repo_slug:
        required: true
        type: string
      sha:
        required: true
        type: string
      module_path:
        required: true
        type: string
      repo_name:
        required: true
        type: string
      repo_url:
        required: true
        type: string
      max_job_timeout:
        required: true
        type: string
      force_java_version:
        required: false
        type: string
      idflakies_java9plus:
        required: false
        type: boolean

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(inputs.max_job_timeout) }}

    # Added permissions to allow GITHUB_TOKEN to read packages/repos
    permissions:
      contents: read
      packages: read
    
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo_slug }}
          ref: ${{ inputs.sha }}

      # The target repo owns the workspace root, so shared actions/scripts live in a hidden sub-folder.
      - name: Checkout Pipeline Actions and Scripts
        uses: actions/checkout@v4
        with:
          path: .pipeline-tools
          sparse-checkout: |
            .github/actions
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Set up Project JDK
        id: jdk
        uses: ./.pipeline-tools/.github/actions/detect-java
        with:
          module-path: ${{ inputs.module_path }}
          force-java-version: ${{ inputs.force_java_version }}

      - name: Save Run Metadata
        uses: ./.pipeline-tools/.github/actions/save-metadata
        with:
          repo-url: ${{ inputs.repo_url }}
          sha: ${{ inputs.sha }}
          module-path: ${{ inputs.module_path }}

      # Inject GITHUB_TOKEN into Maven settings.xml before it runs
      # Allows us to authenticate and resolve parent/import POMs
      # Added universal snapshots so multiple projects can run
      - name: Configure Maven Settings with Universal Snapshots
        run: |
          mkdir -p ~/.m2
          cat << EOF > ~/.m2/settings.xml
          <settings>
            <profiles>
              <profile>
                <id>global-snapshots</id>
                <repositories>
                  <!-- Apache Snapshots -->
                  <repository>
                    <id>apache.snapshots</id>
                    <url>https://repository.apache.org/snapshots</url>
                    <releases><enabled>false</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                  <!-- Sonatype / OSSRH Snapshots (common for many open-source Java projects) -->
                  <repository>
                    <id>sonatype-snapshots</id>
                    <url>https://oss.sonatype.org/content/repositories/snapshots</url>
                    <releases><enabled>false</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                  <!-- Spring Snapshots (if testing Spring-heavy projects) -->
                  <repository>
                    <id>spring-snapshots</id>
                    <url>https://repo.spring.io/snapshot</url>
                    <releases><enabled>false</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>global-snapshots</activeProfile>
            </activeProfiles>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Install Root Project Dependencies
        run: mvn clean install -DskipTests -Dmaven.javadoc.skip=true -B -V -fn -U

      # Always runs on Java 8; on Java 11/17 only when the idflakies_java9plus toggle is on.
      - name: Run iDFlakies
        if: steps.jdk.outputs.java-version == '8' || inputs.idflakies_java9plus
        continue-on-error: true
        uses: ./.pipeline-tools/.github/actions/run-detector
        with:
          tool: idflakies
          module-path: ${{ inputs.module_path }}
          job-timeout-minutes: ${{ inputs.max_job_timeout }}
          mvn-args: >-
            edu.illinois.cs:idflakies-maven-plugin:2.0.0:detect
            -Dstyle.color=always
            -Ddetector.detector_type=random-class-method
            -Ddt.randomize.rounds=10
            -Ddt.detector.original_order.all_must_pass=false
            -Ddt.detector.original_order.retry_count=3

      - name: Build CSV rows
        if: always()
        continue-on-error: true
        env:
          REPO_URL: ${{ inputs.repo_url }}
          SHA: ${{ inputs.sha }}
          MODULE_PATH: ${{ inputs.module_path }}
        run: python3 .pipeline-tools/.github/scripts/build_rows.py idflakies "$REPO_URL" "$SHA" "$MODULE_PATH"

      - name: Archive iDFlakies Results and Logs
        if: always()
        uses: ./.pipeline-tools/.github/actions/archive-results
        with:
          tool: idflakies
          repo-name: ${{ inputs.repo_name }}
          sha: ${{ inputs.sha }}
          results-glob: '**/.dtfixingtools/**'
