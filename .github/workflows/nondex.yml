name: Run NonDex
on:
  workflow_call:
    inputs:
      repo_slug:
        required: true
        type: string
      sha:
        required: true
        type: string
      module_path:
        required: true
        type: string
      repo_name:
        required: true
        type: string
      repo_url:
        required: true
        type: string
      force_java_version:
        required: false
        type: string
      max_job_timeout:
        required: true
        type: string

env:
  NONDEX_VERSION: '2.2.1'

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(inputs.max_job_timeout) }}
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo_slug }}
          ref: ${{ inputs.sha }}

      # The target repo owns the workspace root, so shared actions/scripts live in a hidden sub-folder.
      - name: Checkout Pipeline Actions and Scripts
        uses: actions/checkout@v4
        with:
          path: .pipeline-tools
          sparse-checkout: |
            .github/actions
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Set up Project JDK
        uses: ./.pipeline-tools/.github/actions/detect-java
        with:
          module-path: ${{ inputs.module_path }}
          force-java-version: ${{ inputs.force_java_version }}

      - name: Save Run Metadata
        uses: ./.pipeline-tools/.github/actions/save-metadata
        with:
          repo-url: ${{ inputs.repo_url }}
          sha: ${{ inputs.sha }}
          module-path: ${{ inputs.module_path }}
          
      - name: Install Root Project Dependencies
        run: mvn clean install -DskipTests -Dmaven.javadoc.skip=true -B -V -fn -pl ${{ inputs.module_path }} -am

      - name: Run NonDex
        continue-on-error: true
        uses: ./.pipeline-tools/.github/actions/run-detector
        with:
          tool: nondex
          module-path: ${{ inputs.module_path }}
          mvn-args: edu.illinois:nondex-maven-plugin:${{ env.NONDEX_VERSION }}:nondex

      - name: Build CSV rows
        if: always()
        continue-on-error: true
        env:
          REPO_URL: ${{ inputs.repo_url }}
          SHA: ${{ inputs.sha }}
          MODULE_PATH: ${{ inputs.module_path }}
        run: python3 .pipeline-tools/.github/scripts/build_rows.py idflakies "$REPO_URL" "$SHA" "$MODULE_PATH"

      - name: Archive NonDex Results and Logs
        if: always()
        uses: ./.pipeline-tools/.github/actions/archive-results
        with:
          tool: nondex
          repo-name: ${{ inputs.repo_name }}
          sha: ${{ inputs.sha }}
          results-glob: '**/.nondex/**'
